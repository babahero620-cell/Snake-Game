<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game (Bonus Apple)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        h1 {
            margin: 10px 0 5px 0;
            color: #81c784;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #score-board {
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
            background: #1e1e1e;
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #388e3c;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #gameCanvas {
            border: 6px solid #2e7d32;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            background-color: #4caf50;
            background-image: 
                radial-gradient(#388e3c 15%, transparent 16%),
                radial-gradient(#388e3c 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .insta-btn {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
            transition: all 0.3s ease;
        }

        .insta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.6);
        }

        .controls-note {
            margin-top: 15px;
            font-size: 14px;
            color: #b0bec5;
            background: #1e1e1e;
            padding: 6px 14px;
            border-radius: 8px;
        }

        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 8px;
            margin-top: 15px;
        }

        .btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            user-select: none;
            -webkit-user-select: none;
        }

        .btn:active {
            background-color: #1b5e20;
            transform: scale(0.95);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <h1>Snake Game 🎮</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <a href="https://www.instagram.com/zaiddduu___?igsh=MWw2N3BnMGpvbDhrdA==&igsi=MWw2N3BnMGpvbDhrdA==" target="_blank" class="insta-btn">
        😋 Follow me on Instagram
    </a>

    <div class="controls-note">Play with keyboard arrow keys or the bottom button</div>

    <div class="mobile-controls">
        <button class="btn" id="btn-up">⬆️</button>
        <button class="btn" id="btn-left">⬅️</button>
        <button class="btn" id="btn-right">➡️</button>
        <button class="btn" id="btn-down">⬇️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let dx = 0;
        let dy = 0;
        let appleX = 5;
        let appleY = 5;
        let appleType = 'normal';
        let applesEaten = 0;
        let score = 0;
        let gameStarted = false;
        
        let gameSpeed = 200; 
        let gameTimeout;

        function mainGameLoop() {
            if (isGameOver()) {
                alert("Game Over! Your Score: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            moveSnake();
            drawApple();
            drawSnake();

            gameTimeout = setTimeout(mainGameLoop, gameSpeed);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const centerX = part.x * gridSize + gridSize / 2;
                const centerY = part.y * gridSize + gridSize / 2;
                const radius = gridSize / 2 - 1;

                if (index === 0) {
                    ctx.fillStyle = "#1b5e20";
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#ffffff";
                    let eyeOffset1 = { x: -4, y: -4 };
                    let eyeOffset2 = { x: 4, y: -4 };

                    if (dx === 1) { eyeOffset1 = { x: 3, y: -4 }; eyeOffset2 = { x: 3, y: 4 }; }
                    else if (dx === -1) { eyeOffset1 = { x: -3, y: -4 }; eyeOffset2 = { x: -3, y: 4 }; }
                    else if (dy === 1) { eyeOffset1 = { x: -4, y: 3 }; eyeOffset2 = { x: 4, y: 3 }; }
                    else if (dy === -1) { eyeOffset1 = { x: -4, y: -3 }; eyeOffset2 = { x: 4, y: -3 }; }

                    ctx.beginPath();
                    ctx.arc(centerX + eyeOffset1.x, centerY + eyeOffset1.y, 3, 0, Math.PI * 2);
                    ctx.arc(centerX + eyeOffset2.x, centerY + eyeOffset2.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(centerX + eyeOffset1.x, centerY + eyeOffset1.y, 1.5, 0, Math.PI * 2);
                    ctx.arc(centerX + eyeOffset2.x, centerY + eyeOffset2.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    const gradient = ctx.createRadialGradient(centerX - 2, centerY - 2, 2, centerX, centerY, radius);
                    gradient.addColorStop(0, "#81c784");
                    gradient.addColorStop(1, "#2e7d32");

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawApple() {
            const centerX = appleX * gridSize + gridSize / 2;
            const centerY = appleY * gridSize + gridSize / 2;

            if (appleType === 'bonus') {
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath();
                ctx.arc(centerX, centerY, gridSize / 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = "#d32f2f";
                ctx.beginPath();
                ctx.arc(centerX, centerY, gridSize / 2 - 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#388e3c";
                ctx.fillRect(centerX - 1, appleY * gridSize + 2, 3, 4);
            }
        }

        function moveSnake() {
            if (!gameStarted) return;

            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            snake.unshift(head);

            if (snake[0].x === appleX && snake[0].y === appleY) {
                if (appleType === 'bonus') {
                    score += 3;
                } else {
                    score += 1;
                    applesEaten += 1;
                }
                
                scoreElement.innerText = score;
                generateApple();

                if (gameSpeed > 100) {
                    gameSpeed -= 2;
                }
            } else {
                snake.pop();
            }
        }

        function generateApple() {
            if (appleType !== 'bonus' && applesEaten > 0 && applesEaten % 5 === 0) {
                appleType = 'bonus';
            } else {
                appleType = 'normal';
            }

            appleX = Math.floor(Math.random() * tileCount);
            appleY = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                if (part.x === appleX && part.y === appleY) {
                    generateApple();
                }
            });
        }

        function isGameOver() {
            if (!gameStarted) return false;

            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    return true;
                }
            }

            return false;
        }

        function resetGame() {
            clearTimeout(gameTimeout);
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            gameSpeed = 200;
            applesEaten = 0;
            appleType = 'normal';
            gameStarted = false;
            scoreElement.innerText = score;
            generateApple();
            mainGameLoop();
        }

        function setDirection(newDx, newDy) {
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (newDx === -1 && !goingRight) { dx = -1; dy = 0; gameStarted = true; }
            if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; gameStarted = true; }
            if (newDy === -1 && !goingDown) { dx = 0; dy = -1; gameStarted = true; }
            if (newDy === 1 && !goingUp) { dx = 0; dy = 1; gameStarted = true; }
        }

        document.addEventListener("keydown", (e) => {
            if (e.keyCode === 37) setDirection(-1, 0);
            if (e.keyCode === 38) setDirection(0, -1);
            if (e.keyCode === 39) setDirection(1, 0);
            if (e.keyCode === 40) setDirection(0, 1);
        });

        document.getElementById("btn-up").addEventListener("click", () => setDirection(0, -1));
        document.getElementById("btn-down").addEventListener("click", () => setDirection(0, 1));
        document.getElementById("btn-left").addEventListener("click", () => setDirection(-1, 0));
        document.getElementById("btn-right").addEventListener("click", () => setDirection(1, 0));

        mainGameLoop();
    </script>
</body>
</html>
